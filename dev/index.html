<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GW Moodboard — dev harness</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
    <link rel="stylesheet" href="./gw-moodboard.css" />
    <style>
      /*
        Deliberately plain host-page styling, using the same generic class names
        the app uses internally (.app, .canvas, button). If the moodboard's CSS
        escapes its .gw-mb scope, it lands here and is obvious.
      */
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #e8eaf0;
        color: #223;
      }
      .host-header {
        padding: 12px 20px;
        background: #223055;
        color: #fff;
        font-size: 18px;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
      }
      .host-header button {
        font: inherit;
        font-size: 13px;
        padding: 4px 10px;
        border: 1px solid #7c88ad;
        background: transparent;
        color: #fff;
        border-radius: 3px;
      }
      .host-header button.on {
        background: #fff;
        color: #223055;
      }
      .canvas,
      .app {
        padding: 14px 20px;
        font-size: 15px;
      }
      /*
        Mirrors a Bubble page: a sized parent container, and the plugin element
        filling it completely. No margin, no border — if a gap appears between
        #host-container and #board, that gap is the app's fault, not the fixture's.
      */
      #host-container {
        height: calc(100vh - 46px);
        background: #c9cede;
      }
      #board {
        height: 100%;
      }

      /*
        ?bare drops the test scaffolding and gives the element the whole viewport,
        so the board can be compared like-for-like against how it used to look.
        The scaffolding is what proves the CSS stays scoped; this is for eyeballing.
      */
      body.bare .host-chrome {
        display: none;
      }
      body.bare {
        overflow: hidden;
      }
      body.bare #host-container {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script>
      if (location.search.includes('bare')) document.body.classList.add('bare');
    </script>
    <div class="host-header host-chrome">
      <span>Host page chrome — should stay Georgia on blue</span>
      <span id="role-switch">
        <button data-role="planner" class="on">Planner</button>
        <button data-role="client">Client</button>
      </span>
    </div>

    <div id="host-container"><div id="board"></div></div>

    <!-- Leak canaries: host blocks using the app's own class names. Must stay Georgia. -->
    <div class="canvas host-chrome">Host block using <code>.canvas</code>.</div>
    <div class="app host-chrome">Host block using <code>.app</code>.</div>

    <script src="./gw-moodboard.js"></script>
  </body>
</html>
