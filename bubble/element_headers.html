<!-- GW Moodboard — plugin element "Headers" field.

     These URLs are fixed. GitHub Actions rebuilds and republishes them on every push to
     main (.github/workflows/deploy-bundle.yml), so deploying is `git push` and this field
     never needs editing again.

     That is the whole point of it. Bubble's File Manager mints a new URL per upload, so a
     rebuild meant editing this field too — and a stale URL here serves the old bundle
     silently, with nothing in the console to notice. Pages also sends text/css, which the
     File Manager did not for automated uploads; Chrome refuses a stylesheet served as
     application/octet-stream and says nothing useful about why.

     Cached for 10 minutes, so a deploy lands within that without a hard refresh. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300..500;1,300..500&family=Playfair+Display:ital,wght@0,400..500;1,400..500&display=swap">
<link rel="stylesheet" href="https://steph-gw.github.io/ai-moodboard/gw-moodboard.css">
<script src="https://steph-gw.github.io/ai-moodboard/gw-moodboard.js"></script>
